name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dummy"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with: { node-version: '20' }
    - uses: pnpm/action-setup@v3
      with: { version: 9 }
    - run: pnpm install --config.ignore-scripts=true
    - run: pnpm -F @task2do/schema run generate
    - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dummy"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with: { node-version: '20' }
    - uses: pnpm/action-setup@v3
      with: { version: 9 }
    - run: pnpm install --config.ignore-scripts=true
    - run: pnpm -F @task2do/schema run generate
    - run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dummy"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with: { node-version: '20' }
    - uses: pnpm/action-setup@v3
      with: { version: 9 }
    - run: pnpm install --config.ignore-scripts=true
    - run: pnpm -F @task2do/schema run generate
    - run: pnpm build
