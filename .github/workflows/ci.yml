name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with: { node-version: '20' }
    - uses: pnpm/action-setup@v3
      with: { version: 9 }
    - run: pnpm install --config.ignore-scripts=true
    - run: pnpm lint --if-present

  typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with: { node-version: '20' }
    - uses: pnpm/action-setup@v3
      with: { version: 9 }
    - run: pnpm install --config.ignore-scripts=true
    - run: pnpm -F @task2do/schema exec prisma generate
    - run: pnpm typecheck --if-present

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with: { node-version: '20' }
    - uses: pnpm/action-setup@v3
      with: { version: 9 }
    - run: pnpm install --config.ignore-scripts=true
    - run: pnpm -F @task2do/schema exec prisma generate
    - run: pnpm build
